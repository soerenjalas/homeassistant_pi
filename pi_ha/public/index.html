<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pi · Home Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><strong>π <span>Home Assistant</span></strong><small id="status">Verbinde …</small></header>
  <button id="new" class="new-chat" type="button" title="Neuen Chat starten" aria-label="Neuen Chat starten"><span aria-hidden="true">+</span> Neu</button>
  <main>
    <section id="login" hidden>
      <h2>Mit OpenAI verbinden</h2>
      <p>Verwende dein ChatGPT-Abonnement. Die Anmeldung wird nur in dieser App gespeichert.</p>
      <button id="signin" type="button">Bei OpenAI anmelden</button>
      <p id="login-info"></p><a id="login-url" target="_blank" rel="noopener noreferrer" hidden>Anmeldung öffnen</a>
      <p><code id="login-code"></code></p>
    </section>
    <div id="messages" aria-live="polite" aria-label="Chatverlauf"></div>
    <section id="approvals" aria-live="polite"></section>
    <p id="error" role="alert"></p>
  </main>
  <footer>
    <div id="working" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="working-label">Pi arbeitet …</span></div>
    <p id="activity"></p>
    <form id="composer">
      <label class="sr-only" for="prompt">Deine Frage zu Home Assistant</label>
      <textarea id="prompt" rows="2" maxlength="20000" placeholder="Was möchtest du zuhause erledigen?" aria-describedby="composer-help"></textarea>
      <div class="composer-toolbar">
        <label class="sr-only" for="model">OpenAI-Modell auswählen</label>
        <select id="model" disabled title="OpenAI-Abonnement: verfügbare Modelle; Nutzungslimits hängen vom Modell ab"><option>Lade Modelle …</option></select>
        <div class="composer-actions"><button id="send" type="submit">Senden</button><button id="stop" type="button" hidden>Stoppen</button></div>
      </div>
    </form>
    <small id="composer-help">Enter: senden · Shift+Enter: neue Zeile · Änderungen nur mit Bestätigung</small>
  </footer>
</body>
</html>
